<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2997ff"/>
      <stop offset="50%" style="stop-color:#30d158"/>
      <stop offset="100%" style="stop-color:#2997ff">
        <animate attributeName="stop-color" values="#2997ff;#30d158;#2997ff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>
  <!-- Grid lines -->
  <g opacity="0.05" stroke="#2997ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/><line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/><line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>
  <!-- Glow circles -->
  <circle cx="150" cy="100" r="80" fill="#2997ff" opacity="0.04">
    <animate attributeName="opacity" values="0.04;0.08;0.04" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="100" r="80" fill="#30d158" opacity="0.04">
    <animate attributeName="opacity" values="0.04;0.08;0.04" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Main name -->
  <text x="450" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="-2">
    Antonio Amaral
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>
  <!-- Subtitle -->
  <text x="450" y="135" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#8b949e" letter-spacing="2">
    FULLSTACK DEVELOPER  •  VANCOUVER, BC  🍁
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
  </text>
  <!-- Bottom bar -->
  <rect x="0" y="190" width="900" height="3" rx="1.5">
    <animate attributeName="fill" values="#2997ff;#30d158;#2997ff" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg width="400" height="195" viewBox="0 0 400 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="streakBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  <rect width="400" height="195" rx="6" fill="url(#streakBg)" stroke="#30363d" stroke-width="1"/>
  <text x="200" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" fill="#8b949e">GitHub Streak</text>
  <!-- Total contributions -->
  <text x="70" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#2997ff">1,247</text>
  <text x="70" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Total Contributions</text>
  <text x="70" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">Nov 5, 2024 - Present</text>
  <!-- Divider -->
  <line x1="140" y1="60" x2="140" y2="150" stroke="#30363d" stroke-width="1"/>
  <!-- Current streak -->
  <text x="200" y="75" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#f0883e">🔥</text>
  <text x="200" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#f0883e">9</text>
  <text x="200" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f0883e">Current Streak</text>
  <text x="200" y="135" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">Jan 1 - Jan 9</text>
  <!-- Divider -->
  <line x1="260" y1="60" x2="260" y2="150" stroke="#30363d" stroke-width="1"/>
  <!-- Longest streak -->
  <text x="330" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#2997ff">67</text>
  <text x="330" y="110" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#8b949e">Longest Streak</text>
  <text x="330" y="125" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#8b949e">Nov 5 - Dec 31, 2024</text>
